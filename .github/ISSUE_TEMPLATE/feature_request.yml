name: 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说清楚**你要解决什么问题**，再说你希望怎么解决。
        好的建议描述的是痛点，不是实现方案。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题
      description: 现在是什么场景让你觉得不方便？
      placeholder: 我经常需要...但是目前只能...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你期望的解决方式
      description: 如果有想法就说，没有也可以只描述问题
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
      description: 现在是怎么绕过这个问题的？
  - type: checkboxes
    id: willing
    attributes:
      label: 你是否愿意参与实现
      options:
        - label: 我愿意提 PR 实现这个功能
        - label: 我可以帮忙测试
